<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Pessoa Física</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f7f7f7;
      }

      form {
        max-width: 480px;
        background: #fff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
      }

      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        box-sizing: border-box;
      }

      button {
        margin-top: 18px;
        padding: 10px 16px;
        cursor: pointer;
      }

      #resultado {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        background: #eef6ff;
        color: #0b4f8a;
      }

      #erros {
        margin-top: 12px;
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <h1>Cadastro de Pessoa Física!</h1>

    <form id="form-cadastro">
      <label for="nome">Nome e Sobrenome</label>
      <input id="nome" name="nome" type="text" />

      <label for="cpf">CPF</label>
      <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" />

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" />

      <label for="data_nascimento">Data de nascimento</label>
      <input id="data_nascimento" name="data_nascimento" type="date" />

      <label for="possui_cnh">
        <input id="possui_cnh" name="possui_cnh" type="checkbox" /> Possui CNH
      </label>

      <button type="submit">Validar</button>
    </form>

    <div id="resultado" hidden>Cadastro válido!</div>
    <ul id="erros"></ul>

    <script src="./pessoaFisica.js"></script>
    <script>
      const form = document.getElementById('form-cadastro');
      const resultado = document.getElementById('resultado');
      const errosLista = document.getElementById('erros');

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        const pessoa = {
          nome: document.getElementById('nome').value,
          cpf: document.getElementById('cpf').value,
          email: document.getElementById('email').value,
          data_nascimento: document.getElementById('data_nascimento').value,
          possui_cnh: document.getElementById('possui_cnh').checked,
        };

        const erros = validar(pessoa);
        errosLista.innerHTML = '';
        resultado.hidden = true;

        if (erros.length > 0) {
          erros.forEach((erro) => {
            const item = document.createElement('li');
            item.textContent = erro;
            errosLista.appendChild(item);
          });
          return;
        }

        resultado.hidden = false;
        resultado.textContent = 'Cadastro válido!';
      });
    </script>
  </body>
</html>
