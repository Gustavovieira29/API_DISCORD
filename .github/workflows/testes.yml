name: Testes unitarios

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  testes:
    name: Rodar testes (node:test)
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rodar os testes unitarios
        run: node --test
'@ | Out-File -FilePath ".github\workflows\tests.yml" -Encoding utf8